# Deploy on every push to main — the app to the Cloudflare Worker, and the
# transcoder/activation service to Render.
#
# WHY THIS EXISTS: the Cloudflare dashboard's own Git integration ("Workers
# Builds") stopped firing — five releases sat on main while the live site kept
# serving an older build, and nothing about that was visible from GitHub,
# because Workers Builds runs entirely on Cloudflare's side and reports nothing
# back. This workflow moves the deploy into the repo, where a push either shows
# a green check or a red one with a log you can read.
#
# TWO SERVICES, TWO DEPLOY CYCLES. Cloudflare serves the app (index.html,
# admin.html, the engines) and _worker.js. Render runs server.js — the ffmpeg
# transcoder and the whole activation/licensing store. They are separate
# deploys, and forgetting the second is how v17.5 shipped an admin dashboard
# with Edit and bulk-delete buttons that called endpoints the live server did
# not have yet. Both are wired here so that cannot happen again.
#
# ONE-TIME SETUP — add these under Settings -> Secrets and variables -> Actions.
# For Cloudflare you need EITHER of the first two, not both; the hook is the
# simpler one because the Worker project already holds its own build token.
#
#   CLOUDFLARE_DEPLOY_HOOK_URL  Workers & Pages -> smarteriptv -> Settings ->
#                               Deploy Hooks -> + -> branch main -> copy the URL.
#   CLOUDFLARE_API_TOKEN        My Profile -> API Tokens -> Create Token ->
#                               "Edit Cloudflare Workers" template. Use this if
#                               the project's own build setup is broken rather
#                               than merely idle — it bypasses it entirely.
#   CLOUDFLARE_ACCOUNT_ID       (api-token route only, and only when that token
#                               can see more than one account) Workers & Pages ->
#                               Account ID in the sidebar.
#   RENDER_DEPLOY_HOOK_URL      (only if Render's own auto-deploy is off) Render
#                               -> your service -> Settings -> Deploy Hook.
#
# Every hook URL carries its own key, so treat them as secrets: anyone holding
# one can trigger a deploy.
#
# With neither Cloudflare secret the app job fails loudly, because that is the
# critical path. Without RENDER_DEPLOY_HOOK_URL the render job only WARNS and
# skips — Render can equally well be deploying itself from GitHub, and a
# permanently red job for a service that is already updating itself would just
# train you to ignore the red.
name: Deploy

on:
  push:
    branches: [main]
  # lets you re-run a deploy from the Actions tab without pushing anything
  workflow_dispatch:

# A newer push supersedes one still deploying, rather than racing it.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  # ── The app: Cloudflare Worker + static assets ────────────────────────────
  cloudflare:
    name: Deploy app to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The repo's own checks (see CLAUDE.md) — there is no test suite, so this
      # is the whole safety net. A syntax error must not reach the live site.
      - name: Syntax check
        run: |
          node --check portal.js
          node --check _worker.js
          node --check server.js
          node --check sw.js
          node -e "const fs=require('fs');for(const b of fs.readFileSync('index.html','utf8').match(/<script>([\s\S]*?)<\/script>/g))new Function(b.slice(8,-9));console.log('index.html inline scripts ok')"
          node -e "const fs=require('fs');for(const b of fs.readFileSync('admin.html','utf8').match(/<script>([\s\S]*?)<\/script>/g))new Function(b.slice(8,-9));console.log('admin.html inline scripts ok')"

      # Printed so the run log records exactly which build went out — the same
      # numbers the app shows on its splash, sign-in and admin screens.
      - name: Report version being deployed
        run: |
          echo "APP_VERSION:   $(grep -o "APP_VERSION='[0-9.]*'" index.html | head -1)"
          echo "SW CACHE:      $(grep -o "CACHE = '[^']*'" sw.js)"
          echo "ADMIN_VERSION: $(grep -o "ADMIN_VERSION='[0-9.]*'" admin.html | head -1)"

      # TWO WAYS TO DEPLOY, AND THE HOOK IS THE EASY ONE.
      #
      # The Worker project already has a working build setup of its own — repo
      # connected, production branch main, watch paths *, deploy command
      # `npx wrangler deploy`, and its own "smarteriptv build token". All of
      # that is fine; it simply stopped being triggered. A Deploy Hook is a URL
      # that triggers exactly that existing build, so nothing has to be
      # recreated and no second API token has to exist anywhere.
      #
      # Preference order:
      #   1. CLOUDFLARE_DEPLOY_HOOK_URL — pokes the project's own build.
      #      Cloudflare then builds with the token it already holds.
      #   2. CLOUDFLARE_API_TOKEN — this runner deploys directly with wrangler.
      #      Independent of the dashboard integration, so it still works if the
      #      project's build setup is broken rather than merely idle.
      #
      # The `secrets` context is not available to a step-level `if`, so the
      # choice has to be made in a shell step and published as an output.
      - name: Choose a deploy route
        id: route
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # PREFER WRANGLER. The hook only ASKS Cloudflare to build: it answers
          # {"status":"queued"} and reports nothing afterwards, so this job goes
          # green whether the build then succeeds, fails, or never runs. That is
          # the exact failure this workflow was written to end — and it recurred:
          # v19.1.2 was queued at 00:04 and the live site was still serving an
          # older build minutes later, with a green check here the whole time.
          # wrangler uploads the assets itself, in this job, and a failure turns
          # this step red. So when a token exists it wins; the hook stays as the
          # fallback for when it does not.
          if [ -n "$TOKEN" ]; then
            echo "Deploying directly with wrangler (synchronous — a failure fails this job)."
            echo "mode=wrangler" >> "$GITHUB_OUTPUT"
          elif [ -n "$HOOK" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN set, falling back to the deploy hook. The hook only QUEUES a build on Cloudflare's side and reports nothing back, so a green check here does NOT mean the new version is live. Add CLOUDFLARE_API_TOKEN (My Profile -> API Tokens -> 'Edit Cloudflare Workers') to make deploys verifiable."
            echo "Using the project's own Deploy Hook."
            echo "mode=hook" >> "$GITHUB_OUTPUT"
          else
            # NEITHER SECRET IS SET — AND THAT IS A VALID SETUP, NOT A FAILURE.
            # The Worker has Cloudflare's own Git integration connected (Workers &
            # Pages -> smarteriptv -> Settings -> Build), which builds and deploys
            # every push to main by itself. When that is the single deployer, this
            # job has nothing to do and must not fail the run for it — it used to
            # `exit 1` here, which would have turned every push red the moment the
            # redundant deploy hook was removed.
            # Note this is the ONE arrangement where a failed deploy is invisible
            # from GitHub: Cloudflare reports build results only on its own
            # Deployments page. Setting CLOUDFLARE_API_TOKEN moves deployment into
            # this job, where a failure is red and visible.
            echo "::notice::No CLOUDFLARE_API_TOKEN or CLOUDFLARE_DEPLOY_HOOK_URL set — assuming Cloudflare's Git integration deploys this repo on push. Syntax checks ran and passed; this job did NOT deploy anything. Check Workers & Pages -> smarteriptv -> Deployments to confirm the build landed, or set CLOUDFLARE_API_TOKEN to deploy from here and have failures show up red in Actions."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger the project's build (deploy hook)
        if: steps.route.outputs.mode == 'hook'
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          CODE=$(curl -sS -X POST -o /tmp/cf.out -w '%{http_code}' "$HOOK") || {
            echo "::error::Could not reach the Cloudflare deploy hook."; exit 1; }
          echo "Cloudflare responded HTTP $CODE"
          cat /tmp/cf.out || true
          echo
          case "$CODE" in
            2*) echo "Build triggered. Cloudflare builds asynchronously — watch it under Workers & Pages -> smarteriptv -> Deployments." ;;
            *)  echo "::error::Deploy hook returned HTTP $CODE. A 401/404 usually means the hook was deleted or regenerated — copy a fresh one from Settings -> Deploy Hooks."; exit 1 ;;
          esac

      - name: Deploy directly (wrangler)
        if: steps.route.outputs.mode == 'wrangler'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Uses wrangler.jsonc: Worker "smarteriptv", entry _worker.js, with
          # the repo as static assets minus everything in .assetsignore.
          command: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── DID THE VERSION ACTUALLY GO LIVE? ─────────────────────────────────
      # Everything above this point can report success without a single byte
      # reaching a customer. The hook route is the obvious case — it answers
      # {"status":"queued"} and Cloudflare then builds on its own side, telling
      # GitHub nothing — but even wrangler only proves an upload, not that the
      # edge is serving the new bundle.
      #
      # This is what that gap costs, and it is not hypothetical: it is the
      # incident this whole workflow was written for (five releases live-stale
      # with a green check the whole time), and it recurred — v24.32 through
      # v24.39 all deployed through the unverified hook, and the versions were
      # reported as missing from the live site while every run here was green.
      #
      # So: ask the live site what version it is actually serving, and fail the
      # run if it is not the one this commit built. A red run with "live is
      # still 24.31, expected 24.39" is the signal that was missing.
      #
      # Deliberately tolerant of the things that are NOT failures: the build is
      # asynchronous, so it polls rather than checking once, and it only starts
      # failing after the grace window. Transient 5xx/timeouts while Cloudflare
      # swaps the bundle are just retried.
      - name: Verify the live site is serving this version
        if: steps.route.outputs.mode != 'none'
        env:
          SITE: https://smarteriptv.gz-inzi84.workers.dev
        run: |
          WANT=$(grep -o "APP_VERSION='[0-9.]*'" index.html | head -1 | grep -o "[0-9.]*")
          if [ -z "$WANT" ]; then
            echo "::warning::Could not read APP_VERSION out of index.html — skipping the live check."
            exit 0
          fi
          echo "Expecting the live site to serve APP_VERSION $WANT"
          # ~4 minutes of polling. A Cloudflare build of this project takes well
          # under that; going longer would only delay the red.
          for i in $(seq 1 24); do
            GOT=$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "$SITE/index.html" 2>/dev/null \
                  | grep -o "APP_VERSION='[0-9.]*'" | head -1 | grep -o "[0-9.]*" || true)
            if [ "$GOT" = "$WANT" ]; then
              echo "Live site is serving $GOT — deploy confirmed after $((i*10))s."
              exit 0
            fi
            echo "  attempt $i/24: live is serving '${GOT:-(unreadable)}', waiting for $WANT ..."
            sleep 10
          done
          echo "::error::DEPLOY DID NOT GO LIVE. Expected APP_VERSION $WANT, but $SITE is still serving '${GOT:-(unreadable)}' after ~4 minutes. The commit is on main and the deploy was triggered, but Cloudflare is not serving it. Check Workers & Pages -> smarteriptv -> Deployments for a failed or missing build. Setting CLOUDFLARE_API_TOKEN makes this job deploy directly instead of relying on Cloudflare's own build."
          exit 1

  # ── The server: Render (ffmpeg transcoder + activation store) ─────────────
  # Runs independently of the Cloudflare job: a Render problem must not stop
  # the app shipping, and vice versa.
  render:
    name: Deploy server to Render
    runs-on: ubuntu-latest
    steps:
      # depth 2 so the previous commit is present to diff against
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Render rebuilds a container and cold-starts on every deploy, so firing
      # it for an index.html-only change would cost the customer a slow first
      # play for nothing. Only the files the service is actually built from
      # count. A manual run always deploys — that is what it is for.
      - name: Decide whether Render needs a deploy
        id: changed
        run: |
          WATCHED="server.js package.json package-lock.json Dockerfile render.yaml image_482ee8.png"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual run — deploying regardless of what changed."
            echo "hit=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "No parent commit to compare against — deploying."
            echo "hit=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Files changed in this push:"
          echo "$CHANGED" | sed 's/^/  /'
          HIT=0
          for p in $WATCHED; do
            if echo "$CHANGED" | grep -qx "$p"; then HIT=1; echo "-> $p changed; Render needs this."; fi
          done
          if [ "$HIT" = "0" ]; then
            echo "Nothing the Render service is built from changed — skipping the deploy."
          fi
          echo "hit=$HIT" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy
        if: steps.changed.outputs.hit == '1'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "SERVER_BUILD: $(grep -o "SERVER_BUILD = '[0-9.]*'" server.js | head -1)"
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set, so server.js was NOT deployed. If Render auto-deploys from GitHub this is fine and expected. If it does not, the live server is now behind this commit — add the hook under Settings -> Secrets and variables -> Actions (Render -> your service -> Settings -> Deploy Hook)."
            exit 0
          fi
          # -sS keeps curl quiet but still prints real errors; the body is shown
          # because Render returns a JSON deploy id that is worth having in the log.
          CODE=$(curl -sS -X POST -o /tmp/render.out -w '%{http_code}' "$HOOK") || {
            echo "::error::Could not reach the Render deploy hook."; exit 1; }
          echo "Render responded HTTP $CODE"
          cat /tmp/render.out || true
          echo
          case "$CODE" in
            2*) echo "Deploy triggered. Render builds asynchronously — watch it in the Render dashboard, and confirm the admin page's connection line reads [server v$(grep -o "SERVER_BUILD = '[0-9.]*'" server.js | head -1 | grep -o "[0-9.]*")] once it is live." ;;
            *)  echo "::error::Render deploy hook returned HTTP $CODE. A 401/404 usually means the hook URL was rotated or the service was recreated — copy a fresh one from Render -> your service -> Settings -> Deploy Hook."; exit 1 ;;
          esac
